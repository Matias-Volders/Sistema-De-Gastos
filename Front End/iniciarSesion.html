<!DOCTYPE html>
<html lang="es">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesion</title>
</head>
<body>
    <form action="" method="post" id="loginForm">
    <h1>Iniciar Sesión</h1>

    <label for="username">Usuario:</label>

</form>
</body>
</html>
