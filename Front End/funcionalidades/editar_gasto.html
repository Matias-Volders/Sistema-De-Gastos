<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar gasto</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Editar gasto</h1>

    <a href="{{ url_for('gastos') }}">Volver a gastos</a>
    <br><br>
    <a href="{{ url_for('panel') }}">Volver al panel</a>

    {% with mensajes = get_flashed_messages() %}
        {% if mensajes %}
            <ul>
                {% for mensaje in mensajes %}
                    <li>{{ mensaje }}</li>
                {% endfor %}
            </ul>
        {% endif %}
    {% endwith %}

    

    <form action="{{ url_for('editar_gasto', gasto_id=gasto.id) }}" method="post">
        <label>Monto:</label><br>
        <input type="number" step="0.01" name="monto" value="{{ gasto.monto }}" required><br><br>

        <label>Categoría:</label><br>
        <input type="text" name="categoria" value="{{ gasto.categoria }}" required><br><br>

        <label>Descripción:</label><br>
        <input type="text" name="descripcion" value="{{ gasto.descripcion }}" required><br><br>

        <label>Fecha:</label><br>
        <input type="date" name="fecha" value="{{ gasto.fecha }}" required><br><br>

        <button type="submit">Guardar cambios</button>
    </form>
</body>
</html>
