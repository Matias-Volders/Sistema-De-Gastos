<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar gasto</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='static/funcionality.css') }}">
</head>
<body>
    <div class="page-container">

        <header class="page-header">
            <h1 class="page-title">Editar gasto</h1>
            <div class="top-actions">
                <a href="{{ url_for('gastos') }}" class="top-link">Volver a gastos</a>
                <a href="{{ url_for('panel') }}" class="top-link">Volver al panel</a>
            </div>
        </header>

        {% with mensajes = get_flashed_messages() %}
            {% if mensajes %}
                <ul class="flash-messages">
                    {% for mensaje in mensajes %}
                        <li>{{ mensaje }}</li>
                    {% endfor %}
                </ul>
            {% endif %}
        {% endwith %}

        <section class="edit-wrapper">
            <div class="content-card edit-card">
                <h2 class="section-title">Modificar datos del gasto</h2>

                <form action="{{ url_for('editar_gasto', gasto_id=gasto.id) }}" method="post" class="form-block">
                    <label for="monto">Monto</label>
                    <input type="number" step="0.01" name="monto" id="monto" value="{{ gasto.monto }}" required>

                    <label for="categoria">Categoría</label>
                    <input type="text" name="categoria" id="categoria" value="{{ gasto.categoria }}" required>

                    <label for="descripcion">Descripción</label>
                    <input type="text" name="descripcion" id="descripcion" value="{{ gasto.descripcion }}" required>

                    <label for="fecha">Fecha</label>
                    <input type="date" name="fecha" id="fecha" value="{{ gasto.fecha }}" required>

                    <div class="form-actions">
                        <button type="submit" class="btn-primary">Guardar cambios</button>
                        <a href="{{ url_for('gastos') }}" class="btn-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </section>

    </div>
</body>
</html>
