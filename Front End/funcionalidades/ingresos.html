<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Ingresos</title>
</head>
<body>

    <header>
        <h1>Gestión de Ingresos</h1>
        <p>Seleccioná la funcionalidad que querés usar.</p>
    </header>

    <main>
        <section>
            <button onclick="mostrarSeccion('registrar')">Registrar ingreso</button>
            <button onclick="mostrarSeccion('mostrar')">Mostrar ingresos</button>
            <button onclick="mostrarSeccion('editar')">Editar ingreso</button>
            <button onclick="mostrarSeccion('eliminar')">Eliminar ingreso</button>
        </section>

        <hr>

        <section id="registrar" style="display: none;">
            <h2>Registrar Ingreso</h2>
            <form>
                <label for="montoIngreso">Monto:</label><br>
                <input type="number" id="montoIngreso" name="montoIngreso" step="0.01" required><br><br>

                <label for="origenIngreso">Origen:</label><br>
                <input type="text" id="origenIngreso" name="origenIngreso" required><br><br>

                <label for="descripcionIngreso">Descripción:</label><br>
                <input type="text" id="descripcionIngreso" name="descripcionIngreso" required><br><br>

                <button type="submit">Guardar ingreso</button>
            </form>
        </section>

        <section id="mostrar" style="display: none;">
            <h2>Mostrar Ingresos</h2>
            <p>Acá se mostrarán los ingresos registrados.</p>

            <table border="1" cellpadding="8">
                <thead>
                    <tr>
                        <th>N°</th>
                        <th>Monto</th>
                        <th>Fecha</th>
                        <th>Origen</th>
                        <th>Descripción</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="5">Todavía no hay ingresos para mostrar.</td>
                    </tr>
                </tbody>
            </table>
        </section>

        <section id="editar" style="display: none;">
            <h2>Editar Ingreso</h2>
            <form>
                <label for="numeroEditarIngreso">Número del ingreso:</label><br>
                <input type="number" id="numeroEditarIngreso" name="numeroEditarIngreso" required><br><br>

                <label for="nuevoMontoIngreso">Nuevo monto:</label><br>
                <input type="number" id="nuevoMontoIngreso" name="nuevoMontoIngreso" step="0.01"><br><br>

                <label for="nuevoOrigenIngreso">Nuevo origen:</label><br>
                <input type="text" id="nuevoOrigenIngreso" name="nuevoOrigenIngreso"><br><br>

                <label for="nuevaDescripcionIngreso">Nueva descripción:</label><br>
                <input type="text" id="nuevaDescripcionIngreso" name="nuevaDescripcionIngreso"><br><br>

                <button type="submit">Editar ingreso</button>
            </form>
        </section>

        <section id="eliminar" style="display: none;">
            <h2>Eliminar Ingreso</h2>
            <form>
                <label for="numeroEliminarIngreso">Número del ingreso:</label><br>
                <input type="number" id="numeroEliminarIngreso" name="numeroEliminarIngreso" required><br><br>

                <button type="submit">Eliminar ingreso</button>
            </form>
        </section>
    </main>
    <!-----
    <footer>
        <br>
        <a href="panel.html">Volver al panel</a>
    </footer>
    --->
    <script src="script.js"></script>

</body>
</html>
