<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Panel principal</h1>

    {% with mensajes = get_flashed_messages() %}
        {% if mensajes %}
            <ul>
                {% for mensaje in mensajes %}
                    <li>{{ mensaje }}</li>
                {% endfor %}
            </ul>
        {% endif %}
    {% endwith %}

    <p>Bienvenido, <strong>{{ usuario.nombre }}</strong></p>

    <a href="{{ url_for('gastos') }}">Ir a gastos</a>
    
    <a href="{{ url_for('ingresos') }}">Ir a ingresos</a>
    
    <a href="{{ url_for('balance') }}">Ver balance</a>
    
    <a href="{{ url_for('cerrar_sesion') }}">Cerrar sesión</a>
</body>
</html>
